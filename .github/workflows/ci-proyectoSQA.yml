name: CI - SQA Trello Clone

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    unit-tests:
        name: Pruebas unitarias
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            JAVA_VERSION: "17"
        steps:
            - name: Clonar repositorio
              uses: actions/checkout@v4

            - name: Configurar Java ${{ env.JAVA_VERSION }}
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: maven

            - name: Ejecutar pruebas unitarias del backend
              working-directory: ./estoNoEsTrello
              run: |
                  chmod +x mvnw
                  ./mvnw -B test -Dtest="!CPIntegrationTests"

            - name: Subir evidencias de pruebas unitarias
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: evidencias-unitarias
                  path: estoNoEsTrello/target/surefire-reports/

    static-analysis:
        name: Análisis estático con SonarQube
        needs: unit-tests
        if: success() || failure()
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            JAVA_VERSION: "17"
        steps:
            - name: Clonar repositorio
              uses: actions/checkout@v4

            - name: Configurar Java ${{ env.JAVA_VERSION }}
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: maven

            - name: Ejecutar inspección de SonarQube
              working-directory: ./estoNoEsTrello
              # Asegúrate de configurar los secrets en tu repositorio de GitHub
              # y de ajustar la URL y el ProjectKey a los de tu servidor SonarQube.
              run: |
                  chmod +x mvnw
                  ./mvnw -B sonar:sonar \
                    -Dsonar.projectKey=Andres24vs0_Trello-Clone \
                    -Dsonar.host.url=https://sonarcloud.io \
                    -Dsonar.login=${{ secrets.SONAR_TOKEN }}

            - name: Subir reporte de SonarQube local
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: evidencias-sonarqube
                  path: estoNoEsTrello/target/sonar/

    integration-tests:
        name: Pruebas de integración
        needs: unit-tests
        if: success() || failure()
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            JAVA_VERSION: "17"
        steps:
            - name: Clonar repositorio
              uses: actions/checkout@v4

            - name: Configurar Java ${{ env.JAVA_VERSION }}
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: maven

            - name: Ejecutar pruebas de integración del backend
              working-directory: ./estoNoEsTrello
              run: |
                  chmod +x mvnw
                  ./mvnw -B -Dtest='CPIntegrationTests' test

            - name: Subir evidencias de pruebas de integración
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: evidencias-integracion
                  path: estoNoEsTrello/target/surefire-reports/

    system-tests:
        name: Pruebas de sistema y contenedores
        needs: [unit-tests, integration-tests]
        if: success() || failure()
        runs-on: ubuntu-latest
        timeout-minutes: 75
        env:
            JAVA_VERSION: "17"
        steps:
            - name: Clonar repositorio
              uses: actions/checkout@v4

            - name: Configurar Java ${{ env.JAVA_VERSION }}
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: maven

            - name: Empaquetar aplicación backend
              working-directory: ./estoNoEsTrello
              run: |
                  chmod +x mvnw
                  ./mvnw -B -DskipTests package

            # --- CP-S-01 / CP-S-02: precondición de volumen nominal (10 usuarios, 5 espacios c/u) ---
            - name: Sembrar dataset nominal (precondición CP-S-01/CP-S-02)
              working-directory: ./estoNoEsTrello
              run: |
                  ./mvnw -q exec:java \
                    -Dexec.mainClass=com.ingenieriadesoftware.EstoNoEsTrello.testutils.PerformanceDataSeeder \
                    -Dexec.classpathScope=test \
                    -Dexec.args="nominal"

            - name: Respaldar dataset nominal (para poder reiniciarlo entre corridas)
              run: |
                  cp estoNoEsTrello/src/main/resources/JSONs/Users.json \
                     estoNoEsTrello/src/main/resources/JSONs/Users.nominal.seed.json

            - name: Levantar infraestructura Docker
              run: docker compose up --build -d

            - name: Esperar al contenedor de la aplicación
              run: |
                  for i in $(seq 1 30); do
                    if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null 2>&1; then
                      echo "Contenedor listo en http://127.0.0.1:8080"
                      exit 0
                    fi
                    echo "Esperando que el contenedor inicie... intento $i/30"
                    sleep 5
                  done
                  docker compose ps
                  docker compose logs kanban-app || true
                  exit 1

            - name: Instalar JMeter
              run: |
                  curl -L https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz | tar -xz -C /tmp
                  echo "/tmp/apache-jmeter-5.6.3/bin" >> $GITHUB_PATH

            - name: Ejecutar CP-S-01/02 (Carga escalonada)
              run: |
                  for threads in 10 50 100; do
                    mkdir -p estoNoEsTrello/jmeter-report/${threads}u
                    jmeter -n -t estoNoEsTrello/performance-tests/jmeter/kanban-crud-plan.jmx \
                      -Jhost=127.0.0.1 -Jport=8080 -Jthreads=${threads} -Jrampup=10 -Jduration=300 \
                      -l estoNoEsTrello/jmeter-report/${threads}u/results.jtl -e -o estoNoEsTrello/jmeter-report/${threads}u/html
                  done

            - name: Pruebas de carga JMeter — CP-S-03 (capacidad máxima)
              if: always()
              continue-on-error: true
              run: |
                  docker compose stop kanban-app

                  # Usamos paréntesis para que el 'cd' solo aplique a esta línea y no rompa el path de JMeter
                  (cd estoNoEsTrello && ./mvnw -q exec:java -Dexec.mainClass=com.ingenieriadesoftware.EstoNoEsTrello.testutils.PerformanceDataSeeder -Dexec.classpathScope=test -Dexec.args="max")

                  docker compose start kanban-app
                  sleep 20

                  mkdir -p estoNoEsTrello/jmeter-report/cp-s-03
                  jmeter -n \
                    -t estoNoEsTrello/performance-tests/jmeter/kanban-crud-plan.jmx \
                    -Jhost=127.0.0.1 \
                    -Jport=8080 \
                    -Jthreads=10 \
                    -Jrampup=10 \
                    -Jduration=300 \
                    -l estoNoEsTrello/jmeter-report/cp-s-03/results.jtl \
                    -e -o estoNoEsTrello/jmeter-report/cp-s-03/html

            - name: Capturar evidencias de Docker
              if: always()
              run: |
                  mkdir -p evidencias
                  docker compose ps > evidencias/docker-ps.txt || true
                  docker compose logs kanban-app > evidencias/docker-logs.txt || true

            - name: Subir evidencias de Sistema
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: evidencias-sistema
                  path: |
                      evidencias/
                      estoNoEsTrello/jmeter-report/