name: CI - SQA Trello Clone

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    unit-tests:
        name: Pruebas unitarias
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            JAVA_VERSION: "17"
        steps:
            - name: Clonar repositorio
              uses: actions/checkout@v4

            - name: Configurar Java ${{ env.JAVA_VERSION }}
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: maven

            - name: Ejecutar pruebas unitarias del backend
              working-directory: ./estoNoEsTrello
              run: |
                  chmod +x mvnw
                  ./mvnw -B test -Dtest="!CPIntegrationTests"

            - name: Subir reportes de Unit Tests
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: surefire-unit-tests
                  path: estoNoEsTrello/target/surefire-reports/

    integration-tests:
        name: Pruebas de integración
        needs: unit-tests
        if: success() || failure() # <--- Asegura que corra aunque fallen las unitarias
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            JAVA_VERSION: "17"
        steps:
            - name: Clonar repositorio
              uses: actions/checkout@v4

            - name: Configurar Java ${{ env.JAVA_VERSION }}
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: maven

            - name: Ejecutar pruebas de integración del backend
              working-directory: ./estoNoEsTrello
              run: |
                  chmod +x mvnw
                  ./mvnw -B -Dtest='CPIntegrationTests' test

            - name: Subir reportes de Integration Tests
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: surefire-integration-tests
                  path: estoNoEsTrello/target/surefire-reports/

    system-tests:
        name: Pruebas de sistema y contenedores
        needs: [unit-tests, integration-tests]
        if: success() || failure() # <--- Asegura que corra aunque fallen las anteriores
        runs-on: ubuntu-latest
        timeout-minutes: 90
        env:
            JAVA_VERSION: "17"
        steps:
            - name: Clonar repositorio
              uses: actions/checkout@v4

            - name: Configurar Java ${{ env.JAVA_VERSION }}
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: ${{ env.JAVA_VERSION }}
                  cache: maven

            - name: Empaquetar aplicación backend
              working-directory: ./estoNoEsTrello
              run: |
                  chmod +x mvnw
                  ./mvnw -B -DskipTests package

            - name: Sembrar dataset nominal
              working-directory: ./estoNoEsTrello
              run: |
                  ./mvnw -q exec:java \
                    -Dexec.mainClass=com.ingenieriadesoftware.EstoNoEsTrello.testutils.PerformanceDataSeeder \
                    -Dexec.classpathScope=test \
                    -Dexec.args="nominal"

            - name: Levantar infraestructura Docker
              run: docker compose up --build -d

            - name: Esperar al contenedor
              run: |
                  for i in $(seq 1 30); do
                    if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null 2>&1; then exit 0; fi
                    sleep 5
                  done
                  exit 1

            - name: Instalar JMeter
              run: |
                  curl -L https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz | tar -xz -C /tmp
                  echo "/tmp/apache-jmeter-5.6.3/bin" >> $GITHUB_PATH

            - name: Ejecutar CP-S-01/02 (Carga escalonada)
              run: |
                  for threads in 10 50 100; do
                    mkdir -p jmeter-report/${threads}u
                    jmeter -n -t estoNoEsTrello/performance-tests/jmeter/kanban-crud-plan.jmx \
                      -Jhost=127.0.0.1 -Jport=8080 -Jthreads=${threads} -Jrampup=10 -Jduration=300 \
                      -l jmeter-report/${threads}u/results.jtl -e -o jmeter-report/${threads}u/html
                  done

            - name: Ejecutar CP-S-04 (Capacidad máxima)
              run: |
                  docker compose stop kanban-app
                  cd estoNoEsTrello && ./mvnw -q exec:java -Dexec.mainClass=com.ingenieriadesoftware.EstoNoEsTrello.testutils.PerformanceDataSeeder -Dexec.classpathScope=test -Dexec.args="max"
                  docker compose start kanban-app
                  sleep 20
                  mkdir -p jmeter-report/cp-s-04
                  jmeter -n -t estoNoEsTrello/performance-tests/jmeter/kanban-crud-plan.jmx \
                    -Jhost=127.0.0.1 -Jport=8080 -Jthreads=10 -Jrampup=10 -Jduration=300 \
                    -l jmeter-report/cp-s-04/results.jtl -e -o jmeter-report/cp-s-04/html

            - name: Capturar logs Docker
              if: always()
              run: |
                  mkdir -p evidencias
                  docker compose logs kanban-app > evidencias/docker-logs.txt

            - name: Subir evidencias de Sistema
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: evidencias-sistema
                  path: |
                      evidencias/
                      jmeter-report/